# Creates billable web and Postgres services. Review pricing before deploying.
services:
  - type: web
    name: rastogi-dental-research
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rastogi-dental-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: rastogi-dental-db
    plan: 0.1c-256mb
    region: ohio
    databaseName: dental_research
    user: dental
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
